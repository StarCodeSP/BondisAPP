<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">star</span>
</button>
<button class="star-btn text-on-surface-variant hover:text-primary transition-colors focus:outline-none" data-value="3" type="button">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">star</span>
</button>
<button class="star-btn text-on-surface-variant hover:text-primary transition-colors focus:outline-none" data-value="4" type="button">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">star</span>

<button class="star-btn text-on-surface-variant hover:text-primary transition-colors focus:outline-none" data-value="5" type="button">

<span class="material-symbols-outlined text-secondary">cleaning_services</span>

        </label>
<div class="flex justify-between items-center px-4 pt-2" id="cleanRating">
<button class="clean-star-btn text-on-surface-variant hover:text-secondary transition-colors focus:outline-none" data-value="1" type="button">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">star</span>
</button>
<button class="clean-star-btn text-on-surface-variant hover:text-secondary transition-colors focus:outline-none" data-value="2" type="button">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">star</span>
</button>
<button class="clean-star-btn text-on-surface-variant hover:text-secondary transition-colors focus:outline-none" data-value="3" type="button">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">star</span>
</button>
<button class="clean-star-btn text-on-surface-variant hover:text-secondary transition-colors focus:outline-none" data-value="4" type="button">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">star</span>
</button>
<button class="clean-star-btn text-on-surface-variant hover:text-secondary transition-colors focus:outline-none" data-value="5" type="button">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">star</span>
</button>

</div>
<!-- Occupancy Level -->
<div class="flex flex-col gap-stack-gap-sm bg-surface-container p-stack-gap-md rounded-xl shadow-md" style="border: 1px solid rgba(255,255,255,0.05);">
<label class="font-title-md text-title-md text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-secondary">group</span>
          Nivel de Ocupación
        </label>
<div class="grid grid-cols-2 gap-stack-gap-sm mt-2">
<label class="occupancy-option cursor-pointer">
<input class="peer hidden" name="occupancy" required="" type="radio" value="empty">
<div class="flex flex-col items-center justify-center p-3 rounded-lg bg-surface-container-highest text-on-surface-variant transition-all peer-checked:bg-secondary/15 peer-checked:text-secondary peer-checked:shadow-[inset_0_0_0_1px_theme(colors.secondary)] h-24">
<span class="material-symbols-outlined text-[32px] mb-1">airline_seat_recline_normal</span>
<span class="font-label-caps text-label-caps text-center">Vacío</span>
</div>
</label>
<label class="occupancy-option cursor-pointer">
<input class="peer hidden" name="occupancy" type="radio" value="moderate">

        Enviar Reporte
      </button>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    
    // Input Focus Styling
    const inputs = document.querySelectorAll('select, textarea');
    inputs.forEach(input => {
      input.addEventListener('focus', () => {
        input.style.borderColor = 'theme(colors.secondary)'; // Approximating turquoise glow
        input.style.boxShadow = '0 0 0 1px theme(colors.secondary)';
      });
      input.addEventListener('blur', () => {
        input.style.borderColor = 'rgba(255,255,255,0.1)';
        input.style.boxShadow = 'none';
      });
    });

    // Star Rating Logic
    function setupRating(containerId, inputId, highlightColorClass, defaultColorClass) {
      const container = document.getElementById(containerId);
      const buttons = container.querySelectorAll('button');
      const hiddenInput = document.getElementById(inputId);

      buttons.forEach(button => {
        button.addEventListener('click', () => {
          const rating = parseInt(button.dataset.value);
          hiddenInput.value = rating;
          
          buttons.forEach((btn, index) => {
            const icon = btn.querySelector('span');
            if (index < rating) {
              icon.style.fontVariationSettings = "'FILL' 1";
              btn.classList.remove(defaultColorClass);
              btn.classList.add(highlightColorClass);
            } else {
              icon.style.fontVariationSettings = "'FILL' 0";
              btn.classList.remove(highlightColorClass);
              btn.classList.add(defaultColorClass);
            }
          });
          
          // Small haptic feedback simulation / animation
          button.style.transform = 'scale(1.2)';
          setTimeout(() => {
            button.style.transform = 'scale(1)';
          }, 150);
        });
      });
    }

    setupRating('generalRating', 'generalRatingValue', 'text-primary', 'text-on-surface-variant');
    setupRating('cleanRating', 'cleanRatingValue', 'text-secondary', 'text-on-surface-variant');

    // Form Submit Simulation
    const form = document.getElementById('reportForm');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Enviando...';
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-80');

      setTimeout(() => {
        submitBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> ¡Gracias!';
        submitBtn.classList.remove('bg-primary');
        submitBtn.classList.add('bg-secondary', 'text-on-secondary');
        
        // Reset after delay
        setTimeout(() => {
          form.reset();
          
          // Reset visual states
          submitBtn.innerHTML = originalText;
          submitBtn.classList.add('bg-primary');
          submitBtn.classList.remove('bg-secondary', 'text-on-secondary', 'opacity-80');
          submitBtn.disabled = false;
          
          // Reset stars manually
          document.querySelectorAll('.star-btn span, .clean-star-btn span').forEach(icon => {
             icon.style.fontVariationSettings = "'FILL' 0";
          });
          document.querySelectorAll('.star-btn').forEach(btn => {
             btn.classList.remove('text-primary');
             btn.classList.add('text-on-surface-variant');
          });
           document.querySelectorAll('.clean-star-btn').forEach(btn => {
             btn.classList.remove('text-secondary');
             btn.classList.add('text-on-surface-variant');
          });
        }, 2000);
      }, 1200);
    });
  });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container/90 backdrop-blur-xl" data-active-classes="text-secondary"><div class="flex justify-around items-center h-16 px-unit"><a class="flex flex-col items-center justify-center gap-1 w-full h-full text-on-surface-variant transition-colors" data-path="inicio" href="#"><span class="material-symbols-outlined">home</span><span class="font-label-caps text-label-caps">Inicio</span></a><a class="flex flex-col items-center justify-center gap-1 w-full h-full text-on-surface-variant transition-colors" data-path="paradas" href="#"><span class="material-symbols-outlined">location_on</span><span class="font-label-caps text-label-caps">Paradas</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-full h-full transition-colors text-secondary" data-path="reportar" href="#"><span class="material-symbols-outlined">rate_review</span><span class="font-label-caps text-label-caps">Reportar</span></a><a class="flex flex-col items-center justify-center gap-1 w-full h-full text-on-surface-variant transition-colors" data-path="perfil" href="#"><span class="material-symbols-outlined">person</span><span class="font-label-caps text-label-caps">Perfil</span></a></div></nav>
