<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BondisAPP - Territorios Vivos</title>
    <style>
        :root {
            --primary: #0066cc;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --subtext: #666666;
            --border: #e1e4e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.4;
            padding: 12px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            padding: 0 8px;
        }

        header h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        header p {
            color: var(--subtext);
            font-size: 0.9rem;
        }

        .grid-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .grid-layout {
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 20px;
            }
            body {
                padding: 20px 15px;
            }
            header h1 {
                font-size: 2.2rem;
            }
            header p {
                font-size: 1.05rem;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--text);
        }

        /* Iframe responsivo de tu mapa original */
        iframe {
            width: 100%;
            height: 50vh;
            min-height: 350px;
            max-height: 500px;
            border: 0;
            border-radius: 8px;
            display: block;
        }

        /* Formulario maquetado optimizado para pantallas táctiles */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
        }

        select, textarea, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 1rem; /* Evita el auto-zoom en iOS/Android */
            background-color: #fafafa;
            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23666666" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position-x: 98%;
            background-position-y: 50%;
        }

        .btn-dummy {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BondisAPP</h1>
            <p>Aplicación colaborativa del transporte público</p>
        </header>

        <div class="grid-layout">
            
            <!-- Tu iframe de mapa intacto -->
            <div class="card">
                <h2>Explorar Territorio</h2>
                <div id="app">
                    <iframe src="/mapa_paradas_montevideo" loading="lazy" allowfullscreen></iframe>
                </div>
            </div>

            <!-- Formulario maquetado (demo) -->
            <div class="card">
                <h2>Registrar Experiencia</h2>
                <p style="font-size: 0.85rem; color: var(--subtext); margin-bottom: 12px;">
                    Selecciona una categoría y comparte lo que sucede durante tu recorrido.
                </p>

                <div class="form-group">
                    <label>Categoría</label>
                    <select>
                        <option>Condiciones del Transporte</option>
                        <option>Accesibilidad y Rampas</option>
                        <option>Experiencia Cultural / Positiva</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Estado / Situación</label>
                    <select>
                        <option>Ómnibus muy lleno</option>
                        <option>Vehículo en buenas condiciones</option>
                        <option>Dificultad de acceso / Rampa rota</option>
                        <option>Artista callejero / Actividad cultural</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Comentario adicional</label>
                    <textarea rows="3" placeholder="Ej. El coche venía limpio pero demoró en la parada..."></textarea>
                </div>

                <button type="button" class="btn-dummy">Agregar Reporte (Demo)</button>
            </div>

        </div>
    </div>

</body>
</html>
