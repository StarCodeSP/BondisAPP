<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BondisAPP - Territorios Vivos</title>
    <!-- CSS Leaflet Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #0066cc;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --subtext: #666666;
            --border: #e1e4e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.4;
            padding: 12px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            padding: 0 8px;
        }

        header h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        header p {
            color: var(--subtext);
            font-size: 0.9rem;
        }

        .grid-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .grid-layout {
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 20px;
            }
            body {
                padding: 20px 15px;
            }
            header h1 {
                font-size: 2.2rem;
            }
            header p {
                font-size: 1.05rem;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--text);
        }

        #map {
            width: 100%;
            height: 55vh;
            min-height: 320px;
            max-height: 500px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1;
        }

        /* Formulario adaptado a táctil */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
        }

        select, textarea, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 1rem; /* Previene el zoom automático al hacer tap en celulares */
            background-color: #fafafa;
            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23666666" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position-x: 98%;
            background-position-y: 50%;
        }

        .btn-dummy {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 4px;
        }

        /* Indicadores de Categorías */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .badge-transporte { background: #e3f2fd; color: #0d47a1; }
        .badge-accesibilidad { background: #fff3e0; color: #e65100; }
        .badge-experiencia { background: #f3e5f5; color: #4a148c; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BondisAPP</h1>
            <p>Mapa colaborativo de experiencias del territorio urbano</p>
        </header>

        <div class="grid-layout">
            
            <!-- Columna Mapa (Primero en celulares) -->
            <div class="card">
                <h2>Explorar Territorio</h2>
                <div id="map"></div>
            </div>

            <!-- Columna Formulario (Debajo del mapa en celulares) -->
            <div class="card">
                <h2>Registrar Experiencia</h2>
                <p style="font-size: 0.85rem; color: var(--subtext); margin-bottom: 12px;">
                    Selecciona una categoría y comparte lo que sucede durante tu recorrido.
                </p>

                <div class="form-group">
                    <label>Categoría</label>
                    <select>
                        <option>Condiciones del Transporte</option>
                        <option>Accesibilidad y Rampas</option>
                        <option>Experiencia Cultural / Positiva</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Estado / Situación</label>
                    <select>
                        <option>Ómnibus muy lleno</option>
                        <option>Vehículo en buenas condiciones</option>
                        <option>Dificultad de acceso / Rampa rota</option>
                        <option>Artista callejero / Actividad cultural</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Comentario adicional</label>
                    <textarea rows="3" placeholder="Ej. El coche venía con los asientos limpios..."></textarea>
                </div>

                <button type="button" class="btn-dummy">Agregar Reporte (Demo)</button>
            </div>

        </div>
    </div>

    <!-- Script Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar Mapa centrado en Montevideo
        const map = L.map('map', {
            tap: true // Optimiza los toques en pantallas táctiles móviles
        }).setView([-34.9011, -56.1645], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Marcadores de prueba
        const marcadoresDemo = [
            {
                lat: -34.9011,
                lng: -56.1645,
                titulo: "Transporte",
                badge: "badge-transporte",
                texto: "Ómnibus muy lleno en hora pico."
            },
            {
                lat: -34.9065,
                lng: -56.1850,
                titulo: "Experiencia",
                badge: "badge-experiencia",
                texto: "Artista callejero tocando música en vivo."
            },
            {
                lat: -34.8910,
                lng: -56.1520,
                titulo: "Accesibilidad",
                badge: "badge-accesibilidad",
                texto: "Parada sin rampa accesible para sillas de ruedas."
            }
        ];

        // Dibujar marcadores
        marcadoresDemo.forEach(m => {
            L.marker([m.lat, m.lng])
                .addTo(map)
                .bindPopup(`
                    <span class="badge ${m.badge}">${m.titulo}</span><br>
                    <strong>${m.texto}</strong>
                `);
        });
    </script>
</body>
</html>
