<!doctype html>
<html lang="es" style="">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      @layer base {
        html,
        body {
          width: 100vw;
          margin: 0;
          padding: 0;
          background-color: #131313;
        }
        body {
          overscroll-behavior: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
        .leaflet-locate-control {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 34px;
          height: 34px;
          padding: 0;
          border: 0;
          border-radius: 4px;
          background: #201f1f;
          color: #43e2d2;
          box-shadow: 0 1px 5px rgba(0, 0, 0, 0.65);
          cursor: pointer;
        }
        .leaflet-locate-control:hover {
          background: #2a2a2a;
        }
        .leaflet-locate-control.is-loading .material-symbols-outlined {
          animation: locate-spin 0.8s linear infinite;
        }
        .current-location-marker {
          position: relative;
          box-sizing: border-box;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 2px solid #131313;
          border-radius: 50%;
          background: #43e2d2;
          color: #003732;
          box-shadow: 0 0 0 6px rgba(67, 226, 210, 0.22), 0 2px 8px rgba(0, 0, 0, 0.45);
        }
        .current-location-marker .material-symbols-outlined {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 22px;
          height: 22px;
          font-size: 22px;
          line-height: 1;
          font-variation-settings: "FILL" 1, "wght" 600;
        }
        @keyframes locate-spin {
          to {
            transform: rotate(360deg);
          }
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#005049",
              "on-tertiary-fixed": "#1c1b1b",
              "tertiary-container": "#aba9a9",
              "tertiary-fixed": "#e5e2e1",
              "secondary-fixed": "#61f9e9",
              "surface-container-high": "#2a2a2a",
              "surface-container": "#201f1f",
              "on-tertiary-fixed-variant": "#474746",
              "inverse-surface": "#e5e2e1",
              secondary: "#43e2d2",
              "on-tertiary": "#313030",
              "on-background": "#e5e2e1",
              "on-surface": "#e5e2e1",
              background: "#131313",
              "on-tertiary-container": "#3f3e3e",
              "on-error-container": "#ffdad6",
              primary: "#ffb77d",
              "surface-container-highest": "#353534",
              "on-secondary-fixed": "#00201d",
              "primary-container": "#ff8c00",
              "inverse-primary": "#904d00",
              "surface-tint": "#ffb77d",
              "on-secondary-container": "#004c46",
              "error-container": "#93000a",
              "surface-variant": "#353534",
              tertiary: "#c8c6c5",
              "inverse-on-surface": "#313030",
              "outline-variant": "#564334",
              "surface-dim": "#131313",
              "on-error": "#690005",
              "primary-fixed-dim": "#ffb77d",
              surface: "#131313",
              "on-primary-fixed-variant": "#6e3900",
              "secondary-fixed-dim": "#3adccc",
              "primary-fixed": "#ffdcc3",
              "on-primary-container": "#623200",
              outline: "#a48c7a",
              "tertiary-fixed-dim": "#c8c6c5",
              "on-secondary": "#003732",
              "secondary-container": "#00c6b6",
              "surface-container-low": "#1c1b1b",
              error: "#ffb4ab",
              "on-primary-fixed": "#2f1500",
              "surface-bright": "#3a3939",
              "on-surface-variant": "#ddc1ae",
              "surface-container-lowest": "#0e0e0e",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "stack-gap-sm": "8px",
              unit: "4px",
              "stack-gap-lg": "24px",
              "stack-gap-md": "16px",
              "container-padding": "20px",
              "grid-columns": "4",
            },
            fontFamily: {
              "label-caps": ["JetBrains Mono"],
              "headline-lg-mobile": ["Hanken Grotesk"],
              "body-sm": ["Hanken Grotesk"],
              "display-lg": ["Hanken Grotesk"],
              "body-lg": ["Hanken Grotesk"],
              "headline-lg": ["Hanken Grotesk"],
              "title-md": ["Hanken Grotesk"],
            },
            fontSize: {
              "label-caps": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "500",
                },
              ],
              "headline-lg-mobile": [
                "28px",
                { lineHeight: "34px", fontWeight: "700" },
              ],
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "display-lg": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "800",
                },
              ],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
              "title-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-background text-on-background font-body-lg overflow-x-hidden">
    <header
      class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"
    >
      <div class="h-16 px-container-padding flex items-center justify-between">
        <div class="flex items-center gap-stack-gap-sm">
          <img
            alt="BusRate Logo"
            class="h-8 w-auto object-contain"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBoQ4Tt0KeuVLKYU2c87upQIXiwdYk4KSkDBDMqm0ErDC_s-4KJNuw13ZnDa4ahcKnZNkDJ-kvKF7LamFqAf7Mxn3UiZjnuDcNTdpeKThOgVY0iTZNG-rSreMCAPAEBt0jgNOsxoweVZ0wg7EkkoYrhxXQR_LF_8ugfqX1ND23mNFLe_F877oSjGdxra0Wje6APbLZPD5QU1Avcw7XzrdsFgVDuObJW95TBo7ze161_nQkOf049tUWD"
          /><span
            class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface"
            >Paradas</span
          >
        </div>
        <div
          class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"
        >
          <span class="material-symbols-outlined text-on-primary text-[18px]"
            >person</span
          >
        </div>
      </div>
    </header>
    <main class="flex flex-col relative w-full bg-background min-h-screen">
      <div
        class="flex flex-col w-full gap-stack-gap-md px-container-padding pb-stack-gap-lg"
      >
        <div class="w-full relative">
          <div
            id="leaflet-map"
            class="relative w-full rounded-xl overflow-hidden shadow-lg shadow-black/50 h-[50vh]"
          ></div>
          <div
            id="map-zoom-message"
            class="pointer-events-none absolute inset-0 flex items-center justify-center text-center px-6 text-on-surface-variant font-title-md text-title-md bg-surface/60 backdrop-blur-[1px]"
          >
            zoom in para ver las paradas
          </div>
          <div
            class="absolute top-2 right-2 bg-surface-container-high/90 backdrop-blur-md px-3 py-1 rounded-full flex items-center gap-1 z-[400]"
          >
            <span
              class="material-symbols-outlined text-secondary text-[16px]"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >my_location</span
            >
            <span id="distance-badge" class="font-label-caps text-label-caps text-on-surface"
              >Buscando...</span
            >
          </div>
          <div
            class="absolute bottom-3 left-4 flex flex-col z-[400] drop-shadow-md"
          >
            <span
              id="selected-stop-name"
              class="font-headline-lg text-headline-lg text-on-surface"
              >Buscando parada…</span
            >
            <span
              id="selected-stop-subtitle"
              class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1"
            >
              <span class="material-symbols-outlined text-[14px]"
                >directions_bus</span
              >
              Estación principal
            </span>
          </div>
        </div>
        <div class="flex flex-col gap-2 w-full">
          <div class="flex items-center justify-between w-full">
            <span
              class="font-title-md text-title-md text-on-background flex items-center gap-2"
              ><span
                class="material-symbols-outlined text-secondary text-[20px]"
                >near_me</span
              >Paradas Cercanas</span
            ><span
              id="stop-count"
              class="font-label-caps text-label-caps text-on-surface-variant"
              >Buscando...</span
            >
          </div>
          <div
            id="nearby-stops"
            class="flex gap-2 overflow-x-auto pb-1 scrollbar-none"
          ></div>
        </div>
        <div class="flex items-center justify-between w-full mt-2">
          <h2 class="font-title-md text-title-md text-on-background">
            Próximas Llegadas
          </h2>
          <button
            class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-secondary transition-transform active:scale-95"
            id="refresh-btn"
          >
            <span class="material-symbols-outlined text-[20px]">refresh</span>
          </button>
        </div>
        <div id="arrivals-container" class="flex flex-col gap-3 w-full"></div>
      </div>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/static/paradas.js?v=4"></script>
    <nav
      class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container/90 backdrop-blur-xl"
      data-active-classes="text-secondary"
    >
      <div class="flex justify-around items-center h-16 px-unit">
        <a
          class="flex flex-col items-center justify-center gap-1 w-full h-full text-on-surface-variant transition-colors"
          data-path="inicio"
          href="/"
          ><span class="material-symbols-outlined">home</span
          ><span class="font-label-caps text-label-caps">Inicio</span></a
        ><a
          aria-current="page"
          class="flex flex-col items-center justify-center gap-1 w-full h-full transition-colors text-secondary"
          data-path="paradas"
          href="/paradas"
          ><span class="material-symbols-outlined">location_on</span
          ><span class="font-label-caps text-label-caps">Paradas</span></a
        ><a
          class="flex flex-col items-center justify-center gap-1 w-full h-full text-on-surface-variant transition-colors"
          data-path="reportar"
          href="/reportar"
          ><span class="material-symbols-outlined">rate_review</span
          ><span class="font-label-caps text-label-caps">Reportar</span></a
        ><a
          class="flex flex-col items-center justify-center gap-1 w-full h-full text-on-surface-variant transition-colors"
          data-path="perfil"
          href="/perfil"
          ><span class="material-symbols-outlined">person</span
          ><span class="font-label-caps text-label-caps">Perfil</span></a
        >
      </div>
    </nav>
  </body>
</html>
