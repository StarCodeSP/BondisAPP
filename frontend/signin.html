<!doctype html>
<html lang="es" style="">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          width: 100vw;
          margin: 0;
          padding: 0;
          background-color: #131313;
        }
        body {
          overscroll-behavior: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#005049",
              "on-tertiary-fixed": "#1c1b1b",
              "tertiary-container": "#aba9a9",
              "tertiary-fixed": "#e5e2e1",
              "secondary-fixed": "#61f9e9",
              "surface-container-high": "#2a2a2a",
              "surface-container": "#201f1f",
              "on-tertiary-fixed-variant": "#474746",
              "inverse-surface": "#e5e2e1",
              secondary: "#43e2d2",
              "on-tertiary": "#313030",
              "on-background": "#e5e2e1",
              "on-surface": "#e5e2e1",
              background: "#131313",
              "on-tertiary-container": "#3f3e3e",
              "on-error-container": "#ffdad6",
              primary: "#ffb77d",
              "surface-container-highest": "#353534",
              "on-secondary-fixed": "#00201d",
              "primary-container": "#ff8c00",
              "inverse-primary": "#904d00",
              "surface-tint": "#ffb77d",
              "on-secondary-container": "#004c46",
              "error-container": "#93000a",
              "surface-variant": "#353534",
              tertiary: "#c8c6c5",
              "inverse-on-surface": "#313030",
              "outline-variant": "#564334",
              "surface-dim": "#131313",
              "on-error": "#690005",
              "primary-fixed-dim": "#ffb77d",
              surface: "#131313",
              "on-primary-fixed-variant": "#6e3900",
              "secondary-fixed-dim": "#3adccc",
              "primary-fixed": "#ffdcc3",
              "on-primary-container": "#623200",
              outline: "#a48c7a",
              "tertiary-fixed-dim": "#c8c6c5",
              "on-secondary": "#003732",
              "secondary-container": "#00c6b6",
              "surface-container-low": "#1c1b1b",
              error: "#ffb4ab",
              "on-primary-fixed": "#2f1500",
              "surface-bright": "#3a3939",
              "on-surface-variant": "#ddc1ae",
              "surface-container-lowest": "#0e0e0e",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "stack-gap-sm": "8px",
              unit: "4px",
              "stack-gap-lg": "24px",
              "stack-gap-md": "16px",
              "container-padding": "20px",
              "grid-columns": "4",
            },
            fontFamily: {
              "label-caps": ["JetBrains Mono"],
              "headline-lg-mobile": ["Hanken Grotesk"],
              "body-sm": ["Hanken Grotesk"],
              "display-lg": ["Hanken Grotesk"],
              "body-lg": ["Hanken Grotesk"],
              "headline-lg": ["Hanken Grotesk"],
              "title-md": ["Hanken Grotesk"],
            },
            fontSize: {
              "label-caps": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "500",
                },
              ],
              "headline-lg-mobile": [
                "28px",
                { lineHeight: "34px", fontWeight: "700" },
              ],
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "display-lg": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "800",
                },
              ],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
              "title-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
            },
          },
        },
      };
    </script>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-background text-on-background font-body-lg overflow-x-hidden">
    <header
      class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"
    >
      <div class="h-16 px-container-padding flex items-center justify-between">
        <div class="flex items-center gap-stack-gap-sm">
          <img
            alt="BusRate Logo"
            class="h-8 w-auto object-contain"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBoQ4Tt0KeuVLKYU2c87upQIXiwdYk4KSkDBDMqm0ErDC_s-4KJNuw13ZnDa4ahcKnZNkDJ-kvKF7LamFqAf7Mxn3UiZjnuDcNTdpeKThOgVY0iTZNG-rSreMCAPAEBt0jgNOsxoweVZ0wg7EkkoYrhxXQR_LF_8ugfqX1ND23mNFLe_F877oSjGdxra0Wje6APbLZPD5QU1Avcw7XzrdsFgVDuObJW95TBo7ze161_nQkOf049tUWD"
          />
        </div>
      </div>
    </header>
    <main
      class="flex flex-col relative w-full pt-16 bg-background min-h-screen"
    >
      <div
        class="flex flex-col w-full px-container-padding pt-2 pb-28 relative overflow-hidden"
      >
        <!-- Subtle Ambient Glow Background Element -->
        <div
          class="absolute -top-24 -right-16 w-64 h-64 bg-primary/10 rounded-full blur-3xl pointer-events-none"
        ></div>
        <div
          class="absolute top-80 -left-20 w-60 h-60 bg-secondary/10 rounded-full blur-3xl pointer-events-none"
        ></div>
        <!-- Top Action Bar (Volver y Micro-Branding) -->
        <div
          class="flex items-center justify-between pt-stack-sm pb-4 relative z-10"
        >
          <button
            aria-label="Volver"
            class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-container-high active:scale-95 transition-all"
            onclick="window.history.back()"
            type="button"
          >
            <span class="material-symbols-outlined text-[20px]"
              >arrow_back</span
            >
          </button>
        </div>
        <!-- Heading Section with generous breathing room -->
        <header class="flex flex-col gap-2 mt-2 mb-6 relative z-10">
          <div class="inline-flex items-center gap-2 mb-1">
            <div
              class="w-7 h-7 rounded-lg bg-primary/20 flex items-center justify-center text-primary"
            >
              <span class="material-symbols-outlined text-[18px]"
                >verified_user</span
              >
            </div>
            <span
              class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest"
              >BusRate Pass</span
            >
          </div>
          <h1
            class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight"
          >
            Crea tu <span class="text-primary">cuenta</span>
          </h1>
          <p
            class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mt-1 leading-relaxed"
          >
            Únete a la comunidad de BusRate para calificar líneas, y reportar el
            estado de buses.
          </p>
        </header>
        <!-- SSO Buttons Stack -->
        <section
          aria-label="Opciones de autenticación"
          class="flex flex-col relative z-10 mb-6"
        >
          <div class="grid grid-cols-1 gap-3">
            <!-- Google SSO -->
            <button
              class="flex items-center justify-center gap-2.5 p-3.5 rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface active:scale-95 transition-all text-left shadow-sm"
              type="button"
            >
              <svg class="w-5 h-5 shrink-0" viewbox="0 0 24 24">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4"
                ></path>
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853"
                ></path>
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                  fill="#FBBC05"
                ></path>
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                  fill="#EA4335"
                ></path>
              </svg>
              <span class="font-body-sm text-body-sm font-medium truncate"
                >Google</span>
            </button>
          </div>
        </section>
        <!-- Clean Divider -->
        <div class="relative mb-6 flex items-center justify-center">
          <div class="w-full h-px bg-surface-container-highest"></div>
          <span
            class="absolute px-4 bg-background font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider"
            >o regístrate con correo</span
          >
        </div>
        <!-- Traditional Email & Password Form with enhanced vertical spacing -->
        <form class="flex flex-col gap-4 relative z-10" id="register-form">
          <div class="flex flex-col gap-2">
            <label
              class="font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase ml-1"
              for="register-name"
              >Nombre Completo</label
            >
            <div class="relative flex items-center">
              <span
                class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none"
                >person</span
              ><input
                class="w-full h-12 pl-11 pr-4 bg-surface-container rounded-xl text-on-surface font-body-sm text-body-sm placeholder:text-on-surface-variant/50 focus:outline-none focus:bg-surface-container-high transition-colors"
                id="register-name"
                placeholder="Tu nombre y apellido"
                required=""
                type="text"
              />
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <label
              class="font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase ml-1"
              for="register-email"
              >Correo Electrónico</label
            >
            <div class="relative flex items-center">
              <span
                class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none"
                >mail</span
              ><input
                class="w-full h-12 pl-11 pr-4 bg-surface-container rounded-xl text-on-surface font-body-sm text-body-sm placeholder:text-on-surface-variant/50 focus:outline-none focus:bg-surface-container-high transition-colors"
                id="register-email"
                placeholder="tu.correo@ejemplo.com"
                required=""
                type="email"
              />
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <label
              class="font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase ml-1"
              >Contraseña</label
            >
            <div class="relative flex items-center">
              <span
                class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none"
                >lock</span
              ><input
                class="w-full h-12 pl-11 pr-11 bg-surface-container rounded-xl text-on-surface font-body-sm text-body-sm placeholder:text-on-surface-variant/50 focus:outline-none focus:bg-surface-container-high transition-colors"
                id="password-input"
                minlength="8"
                placeholder="Mínimo 8 caracteres"
                required=""
                type="password"
              /><button
                aria-label="Alternar visibilidad"
                class="password-toggle absolute right-3.5 text-on-surface-variant hover:text-on-surface transition-colors"
                data-target="password-input"
                type="button"
              >
                <span class="material-symbols-outlined text-[20px]"
                  >visibility</span
                >
              </button>
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <label
              class="font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase ml-1"
              >Confirmar Contraseña</label
            >
            <div class="relative flex items-center">
              <span
                class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none"
                >lock</span
              ><input
                class="w-full h-12 pl-11 pr-11 bg-surface-container rounded-xl text-on-surface font-body-sm text-body-sm placeholder:text-on-surface-variant/50 focus:outline-none focus:bg-surface-container-high transition-colors"
                id="confirm-password-input"
                minlength="8"
                placeholder="Repite tu contraseña"
                required=""
                type="password"
              /><button
                aria-label="Alternar visibilidad"
                class="password-toggle absolute right-3.5 text-on-surface-variant hover:text-on-surface transition-colors"
                data-target="confirm-password-input"
                type="button"
              >
                <span class="material-symbols-outlined text-[20px]"
                  >visibility</span
                >
              </button>
            </div>
          </div>
          <label
            class="flex items-start gap-2.5 pt-1.5 pb-2 px-1 cursor-pointer select-none"
            ><input
              checked=""
              class="w-4 h-4 rounded bg-surface-container text-primary-container focus:ring-0 focus:outline-none cursor-pointer accent-primary-container mt-0.5"
              type="checkbox"
            /><span
              class="font-body-sm text-body-sm text-on-surface-variant leading-snug"
              >Acepto los
              <a class="underline hover:text-on-surface" href="#"
                >Términos de servicio</a
              >
              y la
              <a class="underline hover:text-on-surface" href="#"
                >Política de privacidad</a
              >
              de BusRate</span
            ></label
          ><button
            class="mt-1 w-full h-12 rounded-xl bg-primary-container text-on-primary-container font-title-md text-title-md font-bold flex items-center justify-center gap-2 shadow-lg hover:brightness-110 active:scale-[0.98] transition-all"
            type="submit"
          >
            <span class="">Crear cuenta gratis</span
            ><span class="material-symbols-outlined text-[20px]"
              >arrow_forward</span
            >
          </button>
          <p
            aria-live="polite"
            class="font-body-sm text-body-sm min-h-5 text-center"
            id="register-message"
          ></p>
        </form>
        <!-- Community Activity Spark / Trust Cue -->
        <!-- Register Link & Legal Footer -->
        <footer class="mt-6 flex flex-col items-center gap-3 text-center">
          <div
            class="flex items-center justify-center gap-1.5 font-body-sm text-body-sm"
          >
            <span class="text-on-surface-variant">¿Ya tienes una cuenta?</span
            ><a
              class="font-semibold text-secondary hover:underline transition-all"
              href="/login"
              >Inicia sesión</a
            >
          </div>
        </footer>
      </div>
      <script src="/static/register.js"></script>
      <script>
        // Simple micro-interaction for one-tap account selector
        document
          .getElementById("sso-primary-user")
          ?.addEventListener("click", function () {
            this.classList.add("scale-95", "opacity-80");
            setTimeout(() => {
              this.classList.remove("scale-95", "opacity-80");
            }, 180);
          });
      </script>
    </main>
  </body>
</html>
